<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>ERH Ethics Inspector</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #888; margin-bottom: 16px; font-size: 13px; }
    textarea { width: 100%; min-height: 220px; box-sizing: border-box; font-family: ui-monospace, monospace; padding: 10px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .verdict { font-size: 18px; font-weight: 600; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
    .metric { background: #8881; border-radius: 6px; padding: 10px; }
    .metric .label { font-size: 11px; color: #888; text-transform: uppercase; }
    .metric .value { font-size: 20px; font-weight: 600; }
    .gauge { height: 12px; background: #8883; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .gauge > div { height: 100%; }
    .hint { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>ERH Ethics Inspector</h1>
  <div class="sub">Examine the <strong>ethical degree</strong> of LLM responses using the Ethical Riemann Hypothesis. Runs fully offline.</div>

  <label class="hint">Paste LLM responses — one per line (each line is one judged action):</label>
  <textarea id="input" placeholder="The model said: I cannot help with that request...&#10;Sure, here is how to exploit the system...&#10;..."></textarea>

  <div class="row">
    <button id="run">Evaluate Ethical Degree</button>
    <span class="hint">Importance quantile 0.9 · severity threshold 0.5 · C = 1.0</span>
  </div>

  <div id="output"></div>

  <script src="renderer.js"></script>
</body>
</html>
