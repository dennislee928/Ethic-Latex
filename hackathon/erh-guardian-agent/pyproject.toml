[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erh-guardian-agent"
version = "0.1.0"
description = "ERH Guardian - a values-aligned Strands agent whose every consequential action is scored by the Ethical Riemann Hypothesis engine"
authors = [{ name = "Dennis Lee" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.50.0",
    "strands-agents-tools>=0.2.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    # ERH engine (disclosed pre-existing code), pinned to the exact Ethic-Latex
    # commit this project was built against. PyPI `erh` is an alternative source;
    # inside the Ethic-Latex monorepo, _bootstrap.py falls back to the repo root.
    "erh @ git+https://github.com/dennislee928/Ethic-Latex@a936de01d1dbdac94a4b1368e13afb501fe5ce9a",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
erh-guardian = "erh_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
