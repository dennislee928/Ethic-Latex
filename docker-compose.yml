version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=ethic_latex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./erh-security-app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/ethic_latex_db
      - PYTHONPATH=/app
    volumes:
      - ./erh-security-app/backend:/app
      - ./erh_core:/app/erh_core
      - ./simulation:/app/simulation
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./simulation:/app/simulation
      - ./figures:/app/figures
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: python -m notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    restart: unless-stopped

  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./simulation:/app/simulation
      - ./figures:/app/figures
    command: streamlit run simulation/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    depends_on:
      - jupyter

volumes:
  postgres_data:

