services:
  - type: web
    name: ethic-latex-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethic-latex-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000

databases:
  - name: ethic-latex-db
    plan: free
    databaseName: ethic_latex_db
    user: admin

