name: Julia Tests

on:
  push:
    paths:
      - 'julia/**'
      - '.github/workflows/julia_tests.yml'
  pull_request:
    paths:
      - 'julia/**'
      - '.github/workflows/julia_tests.yml'

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Bound Julia dependency resolution/precompilation — it has previously hung
    # until the 6h GitHub job limit cancelled the run.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["SpecialFunctions", "Primes", "Distributions", "HypothesisTests",
                     "Agents", "Graphs", "DifferentialEquations", "OrdinaryDiffEq",
                     "CairoMakie", "DataFrames", "CSV", "JSON3", "HTTP"])
          '

      - name: Run Julia tests
        run: julia --project=julia -e 'using Pkg; Pkg.test("ERH")'

      - name: Check Julia package loads
        run: julia --project=julia -e 'using ERH; @assert ERH.version() == v"0.1.0"'

  parity:
    name: Python ↔ Julia Parity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Julia deps
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["SpecialFunctions", "Primes", "Distributions", "HypothesisTests",
                     "Agents", "Graphs", "DifferentialEquations", "OrdinaryDiffEq",
                     "CairoMakie", "DataFrames", "CSV", "JSON3", "HTTP"])
          '

      - name: Install PyJulia bridge
        run: |
          pip install julia
          python -c "import julia; julia.install()"

      - name: Run parity tests
        run: pytest tests/test_julia_parity.py -v --tb=short
        continue-on-error: true  # non-blocking until all phases complete

  collect-errors:
    name: Collect CI Errors
    runs-on: ubuntu-latest
    needs: [test, parity]
    if: always()
    steps:
      - name: Write error report
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          report = {
            "workflow": "julia_tests",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
            "known_errors": [
              {"job": "test", "step": "Install Julia dependencies", "error": "Pkg.instantiate failed — wrong UUID for CSV and other packages"}
            ]
          }
          with open("ci-errors-julia-tests.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload error report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-errors-julia_tests
          path: ci-errors-julia-tests.json
          retention-days: 3
