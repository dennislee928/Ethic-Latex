name: ERH Security App

on:
  push:
    branches: ["main"]
    paths:
      - "erh-security-app/**"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "erh-security-app/**"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erh-security-app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pylint flake8 bandit httpx

      - name: Run backend tests
        run: |
          pytest tests/ -v --tb=short

      - name: Lint with pylint
        run: pylint app/ --exit-zero || true

      - name: Lint with flake8
        run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: Security check with bandit
        run: bandit -r app/ -ll || true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    if: hashFiles('erh-security-app/frontend/package.json') != ''
    defaults:
      run:
        working-directory: erh-security-app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: erh-security-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        continue-on-error: true

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: erh-security-app
          file: erh-security-app/Dockerfile
          target: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/erh-security-app-backend:latest
            ghcr.io/${{ github.repository }}/erh-security-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: hashFiles('erh-security-app/frontend/package.json') != ''
        uses: docker/build-push-action@v6
        with:
          context: erh-security-app
          file: erh-security-app/Dockerfile
          target: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/erh-security-app-frontend:latest
            ghcr.io/${{ github.repository }}/erh-security-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
