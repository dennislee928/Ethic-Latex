name: Quantum Tests

on:
  workflow_call:
  push:
    branches: ["main","dev"]
    paths:
      - "simulation/quantum/**"
      - "tests/test_quantum_*.py"
      - "pyproject.toml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "simulation/quantum/**"
      - "tests/test_quantum_*.py"
      - "pyproject.toml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  local-simulator:
    name: Local Simulator & Entanglement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (with quantum)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum]" pytest networkx
          pip install qiskit>=1.0.0 qiskit-aer>=0.14.0 qiskit-ibm-runtime>=0.21.0

      - name: Run quantum entanglement tests
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          pytest tests/test_quantum_entanglement.py -v --tb=short

  fallback:
    name: NumPy Fallback (no qiskit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (no quantum)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest numpy networkx

      - name: Run quantum tests (NumPy fallback)
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          pytest tests/test_quantum_entanglement.py -v --tb=short

  cloud-backend:
    name: Cloud Quantum Judge (optional)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum]" pytest networkx

      # IBM_QUANTUM_TOKEN: IBM Cloud API key from Dashboard (REST API uses it for IAM bearer token). Optional: IBM_QUANTUM_INSTANCE (CRN), IBM_QUANTUM_REGION (us-east|eu-de). See https://quantum.cloud.ibm.com/docs/en/api/qiskit-runtime-rest
      - name: Test CloudQuantumJudge connectivity
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          python -c "
          from simulation.quantum.cloud import CloudQuantumJudge
          judge = CloudQuantumJudge()
          j = judge.batch_judge([0.5])[0]
          assert -1 <= j <= 1, f'judgment {j} out of range'
          print('CloudQuantumJudge OK')
          "
        continue-on-error: true
