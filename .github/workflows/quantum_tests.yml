name: Quantum Tests

on:
  workflow_call:
  push:
    branches: ["main","dev"]
    paths:
      - "simulation/quantum/**"
      - "tests/test_quantum_*.py"
      - "pyproject.toml"
      - "julia/src/QuantumSimulator.jl"
      - "julia/src/QuantumWalk.jl"
      - "julia/test/test_quantum_*.jl"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "simulation/quantum/**"
      - "tests/test_quantum_*.py"
      - "pyproject.toml"
      - "julia/src/QuantumSimulator.jl"
      - "julia/src/QuantumWalk.jl"
      - "julia/test/test_quantum_*.jl"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  local-simulator:
    name: Local Simulator & Entanglement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (with quantum)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum]" pytest networkx
          pip install qiskit>=1.0.0 qiskit-aer>=0.14.0 qiskit-ibm-runtime>=0.21.0

      - name: Run quantum entanglement tests
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          pytest tests/test_quantum_entanglement.py -v --tb=short

  fallback:
    name: NumPy Fallback (no qiskit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (no quantum)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest numpy networkx

      - name: Run quantum tests (NumPy fallback)
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          pytest tests/test_quantum_entanglement.py -v --tb=short

  ibm-complex-circuit:
    name: IBM Complex Circuit (AdvancedEthicalQuantumEngine)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum]" pytest networkx
          pip install qiskit>=1.0.0 qiskit-aer>=0.14.0 qiskit-ibm-runtime>=0.21.0

      - name: Test complex circuit on IBM Quantum
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          USE_IBM_QUANTUM: "1"
          IBM_QUANTUM_BACKEND: ibm_fez
        run: |
          if [ -z "$IBM_QUANTUM_TOKEN" ]; then
            echo "Skipped: IBM_QUANTUM_TOKEN not set (normal on fork PRs)"
            exit 0
          fi
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          python scripts/run_quantum_hilbert_figures.py
          echo "AdvancedEthicalQuantumEngine OK (IBM)"
        continue-on-error: true

  julia-quantum:
    name: Julia Quantum (Yao.jl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["SpecialFunctions", "Primes", "Distributions", "HypothesisTests",
                     "Agents", "Graphs", "DifferentialEquations", "OrdinaryDiffEq",
                     "CairoMakie", "DataFrames", "CSV", "JSON3", "HTTP"])
          '

      - name: Run Julia quantum tests
        run: |
          julia --project=julia -e '
            using Test
            include("julia/test/test_quantum_simulator.jl")
            include("julia/test/test_quantum_walk.jl")
          '
        continue-on-error: true  # non-blocking until Yao.jl fully validated

  collect-errors:
    name: Collect CI Errors
    runs-on: ubuntu-latest
    needs: [local-simulator, fallback, ibm-complex-circuit, julia-quantum]
    if: always()
    steps:
      - name: Write error report
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          report = {
            "workflow": "quantum_tests",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
            "known_errors": [
              {"job": "julia-quantum", "step": "Install Julia dependencies", "error": "Pkg.instantiate failed — wrong UUID for CSV and other packages"}
            ]
          }
          with open("ci-errors-quantum-tests.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload error report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-errors-quantum_tests
          path: ci-errors-quantum-tests.json
          retention-days: 3
