name: Build Thesis

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install papermill ipykernel nbconvert

      - name: Run LLM stress test (ERH)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install requests
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Running small-scale LLM stress test (100 actions, OpenAI or Anthropic)..."
            if [ -n "$OPENAI_API_KEY" ]; then
              python scripts/llm_stress_test.py --num-actions 100 --provider openai --output-dir llm_stress_test_results
            else
              python scripts/llm_stress_test.py --num-actions 100 --provider anthropic --output-dir llm_stress_test_results
            fi
          else
            echo "No API key set; running dry-run (no API calls)."
            python scripts/llm_stress_test.py --num-actions 20 --dry-run --output-dir llm_stress_test_results
          fi

      - name: Run Simulation and Generate Figures
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          mkdir -p simulation/output/figures
          mkdir -p simulation/output
          python -m simulation.generate_all_figures

      - name: Run Quantum Phase Transition (optional)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python scripts/run_quantum_phase_transition.py --save-plot --n-points 10 || echo "⚠ Quantum phase transition skipped."

      - name: Run Phase Transition Experiment (J vs stability)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/erh_core
          mkdir -p simulation/output/figures
          python scripts/run_phase_transition_exp.py --no-oracle --save-plot --output-dir simulation/output || echo "⚠ Phase transition exp skipped."

      - name: Fetch and Process Case Study CSV
        run: |
          mkdir -p data data/real_world
          bash scripts/fetch_real_data.sh || true
          python scripts/convert_adult_to_csv.py || true
          python scripts/process_student_to_exam_cheating.py || true
          python scripts/generate_synthetic_sexual_abuse.py || true
        continue-on-error: true

      - name: Run Real-Data Case Study (optional)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # This step is safe if the dataset is missing; the script will exit gracefully.
          python -m simulation.real_data.adult_income_case_study || echo "Real-data case study skipped."

      - name: Run Exam Cheating Case Study (optional)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m simulation.real_data.exam_cheating_case_study || echo "Exam cheating case study skipped."

      - name: Run Sexual Abuse Case Study (optional)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m simulation.real_data.sexual_abuse_case_study || echo "Sexual abuse case study skipped."

      - name: Create Output Directories
        run: |
          mkdir -p simulation/output/figures
          mkdir -p figures
          echo "✓ Output directories created"

      - name: Execute Notebooks
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # Install a kernel for the notebooks
          python -m ipykernel install --user --name python3

          # Ensure output directories exist before running notebooks
          mkdir -p simulation/output/figures
          mkdir -p simulation/output

          # Change to notebooks directory so relative paths work correctly
          cd simulation/notebooks

          # Execute notebooks from notebooks directory with explicit kernel specification
          # We skip 05_generate_paper_figures.ipynb as we ran the script version
          papermill -k python3 01_basic_simulation.ipynb 01_out.ipynb || echo "⚠ Notebook 01 failed, continuing..."
          papermill -k python3 02_judge_comparison.ipynb 02_out.ipynb || echo "⚠ Notebook 02 failed, continuing..."
          papermill -k python3 03_zeta_zeros.ipynb 03_out.ipynb || echo "⚠ Notebook 03 failed, continuing..."
          papermill -k python3 04_parameter_sensitivity.ipynb 04_out.ipynb || echo "⚠ Notebook 04 failed, continuing..."
          papermill -k python3 06_baseline_comparison.ipynb 06_out.ipynb || echo "⚠ Notebook 06 failed, continuing..."
          papermill -k python3 07_zeta_zeros_deep_analysis.ipynb 07_out.ipynb || echo "⚠ Notebook 07 failed, continuing..."
          papermill -k python3 08_psychohistory_integration.ipynb 08_out.ipynb || echo "⚠ Notebook 08 failed, continuing..."

          # Return to project root
          cd ../..

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          # Run unit tests for psychohistory modules
          pytest tests/test_temporal_erh.py tests/test_agent_framework.py tests/test_social_network.py \
                 tests/test_meta_monitor.py tests/test_hybrid_model.py tests/test_psychohistory_integration.py \
                 -v --tb=short

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Psychohistory Simulation Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          mkdir -p simulation/output/psychohistory_tests
          # Run quick tests in CI to save time
          python scripts/run_psychohistory_simulations.py --quick --output-dir simulation/output/psychohistory_tests

      - name: Run Quantum Hilbert Space Simulation
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          mkdir -p simulation/output/figures
          python scripts/run_quantum_hilbert_figures.py

      - name: Download Simulation Figures (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: simulation-figures
          path: figures/simulation/

      - name: Download Alpha Comparison Plot (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: alpha-comparison-plot
          path: figures/alpha_plot/

      - name: Download Phase Transition Figure (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase-transition-figure
          path: figures/phase_transition/

      - name: Download Expand Plan Figures (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: expand-plan-figures
          path: figures/expand/

      - name: Download Comprehensive Report (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: comprehensive-report
          path: figures/comprehensive/

      - name: Download Quantum Figures (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quantum-figures
          path: figures/quantum/

      - name: Prepare Figures for LaTeX
        run: |
          mkdir -p figures
          # Copy figures from simulation/output/figures (where generate_all_figures.py saves them)
          if [ -d "simulation/output/figures" ] && [ "$(ls -A simulation/output/figures/*.pdf 2>/dev/null)" ]; then
            cp simulation/output/figures/*.pdf figures/ 2>/dev/null || true
            echo "Copied PDF figures from simulation/output/figures"
          fi
          if [ -d "simulation/output/figures" ] && [ "$(ls -A simulation/output/figures/*.png 2>/dev/null)" ]; then
            cp simulation/output/figures/*.png figures/ 2>/dev/null || true
            echo "Copied PNG figures from simulation/output/figures"
          fi
          # Copy LLM stress test figure (Π(x), E(x)) if available
          if [ -f "llm_stress_test_results/llm_stress_test_Pi_E.png" ]; then
            cp llm_stress_test_results/llm_stress_test_Pi_E.png figures/
            echo "Copied llm_stress_test_Pi_E.png to figures/"
          fi
          # Copy PNG figures from simulation workflow (final_report)
          if [ -d "figures/simulation" ] && [ "$(ls -A figures/simulation/*.png 2>/dev/null)" ]; then
            cp figures/simulation/*.png figures/ 2>/dev/null || true
            echo "Copied PNG figures from simulation-figures artifact"
          fi
          # Copy alpha_comparison_real_vs_simulated from alpha-comparison-plot (artifact preserves path)
          if [ -f "figures/alpha_plot/alpha_comparison_real_vs_simulated.png" ]; then
            cp figures/alpha_plot/alpha_comparison_real_vs_simulated.png figures/
          elif [ -f "figures/alpha_plot/simulation/output/figures/alpha_comparison_real_vs_simulated.png" ]; then
            cp figures/alpha_plot/simulation/output/figures/alpha_comparison_real_vs_simulated.png figures/
          fi
          find figures/alpha_plot -name "*.png" -exec cp {} figures/ \; 2>/dev/null || true
          # Copy phase_transition from phase-transition-figure
          if [ -f "figures/phase_transition/phase_transition.png" ]; then
            cp figures/phase_transition/phase_transition.png figures/
          elif [ -f "figures/phase_transition/simulation/output/figures/phase_transition.png" ]; then
            cp figures/phase_transition/simulation/output/figures/phase_transition.png figures/
          fi
          find figures/phase_transition -name "*.png" -exec cp {} figures/ \; 2>/dev/null || true
          # Copy expand-plan PDFs (artifact may preserve simulation/output/figures/ path)
          find figures/expand -name "*.pdf" -exec cp {} figures/ \; 2>/dev/null || true
          # Copy quantum-figures (compas_erh_bound, alpha_comparison_bar, normalized_error_oscillation, etc.)
          find figures/quantum -name "*.png" -exec cp {} figures/ \; 2>/dev/null || true
          # Copy comprehensive report figures (final_report contents, incl. universal_error_growth.png)
          if [ -d "figures/comprehensive" ] && [ "$(ls -A figures/comprehensive/*.png 2>/dev/null)" ]; then
            cp figures/comprehensive/*.png figures/ 2>/dev/null || true
            echo "Copied comprehensive report PNG figures"
          fi
          find figures/comprehensive -name "*.png" -exec cp {} figures/ \; 2>/dev/null || true
          # Quantum Hilbert figures (circuit, distribution)
          if [ -d "simulation/output/figures" ]; then
            cp simulation/output/figures/latest_quantum_circuit.png figures/ 2>/dev/null || true
            cp simulation/output/figures/latest_quantum_distribution.png figures/ 2>/dev/null || true
          fi
          echo "Final figures directory:"
          ls -la figures/ || true

      - name: Integrate Figures into LaTeX
        run: |
          python scripts/integrate_figures.py

      - name: Update LaTeX Content with Results
        run: |
          python scripts/update_latex.py

      - name: Generate Markdown Experiment Reports
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python scripts/generate_md_reports.py

      - name: Upload Markdown Experiment Reports
        uses: actions/upload-artifact@v4
        with:
          name: experiment_markdown_reports
          path: |
            docs/EXPERIMENT_REPORTS.md

      - name: Upload Raw Simulation Results
        uses: actions/upload-artifact@v4
        with:
          name: simulation_output_raw
          path: simulation/output/
          retention-days: 14

      - name: Upload LLM stress test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm_stress_test_results
          path: llm_stress_test_results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Free disk space (GitHub Actions runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check LaTeX placeholders
        run: |
          python scripts/check_tex_placeholders.py || echo "::warning::Placeholder strings found in .tex files"
        continue-on-error: true

      - name: Install TeX Live (minimal, not texlive-full)
        run: |
          # Use minimal TeX Live (~1GB) instead of texlive-full (~5–7GB) to avoid "No space left on device"
          # texlive-lang-cjk provides xeCJK.sty (required for ethical_riemann_hypothesis_zh.tex)
          # texlive-lang-chinese provides ctex and Chinese fonts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex \
            texlive-lang-cjk \
            texlive-lang-chinese \
            latexmk

      - name: Compile English LaTeX Document
        run: |
          latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode ethical_riemann_hypothesis_en.tex

      - name: Compile Chinese LaTeX Document
        run: |
          latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode ethical_riemann_hypothesis_zh.tex

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ethical_riemann_hypothesis_pdfs
          path: |
            ethical_riemann_hypothesis_en.pdf
            ethical_riemann_hypothesis_zh.pdf
