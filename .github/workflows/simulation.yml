name: Simulation Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        complexity_dist: ["zipf", "uniform", "power_law"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Simulation
      run: |
        python scripts/run_simulation_batch.py \
          --complexity-dist ${{ matrix.complexity_dist }} \
          --output-dir results

    - name: Upload Simulation Results
      uses: actions/upload-artifact@v4
      with:
        name: simulation-results-${{ matrix.complexity_dist }}
        path: results/
        retention-days: 5

  report:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn tabulate
          
      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: all_results
          
      - name: Consolidate Results
        run: |
          mkdir -p combined_results
          # Move all JSONs to one folder
          find all_results -name "*.json" -exec cp {} combined_results/ \;
          
      - name: Generate Report
        run: |
          python scripts/generate_comprehensive_report.py \
            --input-dir combined_results \
            --output-dir final_report
            
      - name: Verify with R (Optional)
        if: ${{ hashFiles('scripts/verify_analysis.R') != '' }}
        run: |
          if command -v Rscript &> /dev/null; then
            Rscript scripts/verify_analysis.R combined_results final_report/r_verification
          else
            echo "Rscript not found, skipping R verification."
          fi
          
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-report
          path: final_report/
          retention-days: 30

      - name: Deploy Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: final_report
          destination_dir: reports
          keep_files: true
