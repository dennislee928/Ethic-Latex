name: Simulation Pipeline

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  real-data-preparation:
    name: Real Data Preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-

      - name: Create data directories
        run: mkdir -p data data/real_world

      - name: Fetch real-world datasets
        run: |
          bash scripts/fetch_real_data.sh || true

      - name: Convert Adult to CSV or generate synthetic
        run: |
          pip install pandas numpy
          if [ -f data/real_world/adult.data ]; then
            python scripts/convert_adult_to_csv.py
          else
            python scripts/generate_synthetic_adult.py || true
          fi

      - name: Download COMPAS (fallback from ProPublica if needed)
        run: |
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            git lfs pull --include="data/compas-scores-two-years.csv" 2>/dev/null || true
          fi
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            if [ -n "${{ secrets.COMPAS_DATA_URL }}" ]; then
              curl -sL "${{ secrets.COMPAS_DATA_URL }}" -o data/compas-scores-two-years.csv || true
            fi
          fi
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            curl -sL "https://raw.githubusercontent.com/propublica/compas-analysis/master/compas-scores-two-years.csv" -o data/compas-scores-two-years.csv || true
          fi

      - name: Upload Real Data artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-world-datasets
          path: |
            data/
          retention-days: 7

  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        complexity_dist: ["zipf", "uniform", "power_law"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Simulation (parallel)
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          mkdir -p results
          python scripts/run_simulation_batch.py \
            --complexity-dist ${{ matrix.complexity_dist }} \
            --output-dir results \
            --instances 4

      - name: Upload Simulation Results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results-${{ matrix.complexity_dist }}-py${{ matrix.python-version }}
          path: results/
          retention-days: 5

  alpha-comparison:
    name: Alpha Comparison (Real vs Simulated)
    needs: real-data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib pandas numpy scikit-learn

      - name: Download Real Data
        uses: actions/download-artifact@v4
        with:
          name: real-world-datasets
          path: data

      - name: Restore data layout
        run: |
          mkdir -p data
          if [ -d data/real_world ]; then mv data/real_world/* data/ 2>/dev/null || true; fi
          if [ -f data/adult.csv ]; then true; else python scripts/generate_synthetic_adult.py || true; fi

      - name: Calculate Alpha Comparison
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          python scripts/calculate_alpha_comparison.py

      - name: Upload Alpha Comparison Plot
        uses: actions/upload-artifact@v4
        with:
          name: alpha-comparison-plot
          path: simulation/output/figures/alpha_comparison_real_vs_simulated.png
        continue-on-error: true

  phase-transition:
    name: Phase Transition Experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scipy

      - name: Run Phase Transition Experiment
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          mkdir -p simulation/output/figures
          python scripts/run_phase_transition_exp.py --no-oracle --save-plot
        continue-on-error: true

      - name: Upload Phase Transition Figure
        uses: actions/upload-artifact@v4
        with:
          name: phase-transition-figure
          path: simulation/output/figures/phase_transition.png
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: [simulate, alpha-comparison, phase-transition]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-report-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-report-

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn tabulate numpy scipy

      - name: Download Phase Transition Figure
        uses: actions/download-artifact@v4
        with:
          name: phase-transition-figure
          path: simulation/output/figures
        continue-on-error: true

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_results

      - name: Download Alpha Comparison Plot
        uses: actions/download-artifact@v4
        with:
          name: alpha-comparison-plot
          path: alpha_plot
        continue-on-error: true

      - name: Consolidate Results
        run: |
          mkdir -p combined_results final_report
          find all_results -name "*.json" -exec cp {} combined_results/ \; 2>/dev/null || true
          if [ -z "$(ls -A combined_results 2>/dev/null)" ]; then
            echo "[]" > combined_results/placeholder.json
          fi
          if [ -f alpha_plot/alpha_comparison_real_vs_simulated.png ]; then
            cp alpha_plot/alpha_comparison_real_vs_simulated.png final_report/
          fi
          ls -la combined_results/ final_report/ || true

      - name: Generate Report
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          python scripts/generate_comprehensive_report.py \
            --input-dir combined_results \
            --output-dir final_report
        continue-on-error: true

      - name: Install R
        if: hashFiles('scripts/verify_analysis.R') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base

      - name: Install R packages
        if: hashFiles('scripts/verify_analysis.R') != ''
        run: |
          if command -v Rscript &> /dev/null; then
            mkdir -p ~/R/library
            Rscript -e ".libPaths(c('~/R/library', .libPaths())); install.packages('jsonlite', repos='https://cran.rstudio.com/', lib='~/R/library', quiet=TRUE)"
          fi

      - name: Verify with R (Optional)
        if: hashFiles('scripts/verify_analysis.R') != ''
        run: |
          if command -v Rscript &> /dev/null; then
            R_LIBS_USER=~/R/library Rscript scripts/verify_analysis.R combined_results final_report/r_verification || true
          fi

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-report
          path: final_report/
          retention-days: 30

      - name: Upload Figures for Thesis
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulation-figures
          path: final_report/*.png
          retention-days: 30

      - name: Upload Simulation Figures
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quantum-figures
          path: simulation/output/figures/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Expand Plan Figures
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: expand-plan-figures
          path: |
            simulation/output/figures/paper_fig9_normalized_oscillation.pdf
            simulation/output/figures/paper_fig10_phase_transition_h.pdf
            simulation/output/figures/paper_fig11_prime_ladder.pdf
            simulation/output/figures/von_neumann_entropy_over_time.pdf
          if-no-files-found: ignore
          retention-days: 30
