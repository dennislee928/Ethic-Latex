name: Simulation Pipeline

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  real-data-preparation:
    name: Real Data Preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-

      - name: Create data directories
        run: mkdir -p data data/real_world

      - name: Fetch real-world datasets
        run: |
          bash scripts/fetch_real_data.sh || true

      - name: Convert Adult to CSV or generate synthetic
        run: |
          pip install pandas numpy
          if [ -f data/real_world/adult.data ]; then
            python scripts/convert_adult_to_csv.py
          else
            python scripts/generate_synthetic_adult.py || true
          fi

      - name: Download COMPAS (fallback from ProPublica if needed)
        run: |
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            git lfs pull --include="data/compas-scores-two-years.csv" 2>/dev/null || true
          fi
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            if [ -n "${{ secrets.COMPAS_DATA_URL }}" ]; then
              curl -sL "${{ secrets.COMPAS_DATA_URL }}" -o data/compas-scores-two-years.csv || true
            fi
          fi
          if [ ! -f data/compas-scores-two-years.csv ] || [ ! -s data/compas-scores-two-years.csv ]; then
            curl -sL "https://raw.githubusercontent.com/propublica/compas-analysis/master/compas-scores-two-years.csv" -o data/compas-scores-two-years.csv || true
          fi

      - name: Fetch Empirical ERH Data (HuggingFace, AITA, GitHub PR)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q datasets sentence-transformers PyGithub firecrawl-py 2>/dev/null || true
          pip install -q -r requirements.txt 2>/dev/null || true
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          # Skip AITA/GitHub when secrets not set; never fail pipeline
          EXTRA_ARGS=""
          [ -z "$FIRECRAWL_API_KEY" ] && EXTRA_ARGS="$EXTRA_ARGS --skip-aita"
          [ -z "$GITHUB_TOKEN" ] && EXTRA_ARGS="$EXTRA_ARGS --skip-github"
          python scripts/fetch_empirical_erh_data.py \
            --output-dir data/empirical \
            --max-samples 30 \
            --aita-limit 15 \
            --pr-limit 20 \
            --repo dennislee928/Ethic-Latex \
            $EXTRA_ARGS
        continue-on-error: true

      - name: Upload Real Data artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-world-datasets
          path: |
            data/
          retention-days: 7

  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        complexity_dist: ["zipf", "uniform", "power_law"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Simulation (parallel)
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          mkdir -p results
          python scripts/run_simulation_batch.py \
            --complexity-dist ${{ matrix.complexity_dist }} \
            --output-dir results \
            --instances 4

      - name: Upload Simulation Results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results-${{ matrix.complexity_dist }}-py${{ matrix.python-version }}
          path: results/
          retention-days: 5

  alpha-comparison:
    name: Alpha Comparison (Real vs Simulated)
    needs: real-data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib pandas numpy scikit-learn

      - name: Download Real Data
        uses: actions/download-artifact@v4
        with:
          name: real-world-datasets
          path: data

      - name: Restore data layout
        run: |
          mkdir -p data
          if [ -d data/real_world ]; then mv data/real_world/* data/ 2>/dev/null || true; fi
          if [ -f data/adult.csv ]; then true; else python scripts/generate_synthetic_adult.py || true; fi

      - name: Calculate Alpha Comparison
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          python scripts/calculate_alpha_comparison.py

      - name: Run Empirical Validation (COMPAS, Adult, Synthetic)
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          mkdir -p simulation/output
          python scripts/run_empirical_validation.py --output simulation/output/real_world_results.json

      - name: Upload Alpha Comparison Plot
        uses: actions/upload-artifact@v4
        with:
          name: alpha-comparison-plot
          path: simulation/output/figures/alpha_comparison_real_vs_simulated.png
        continue-on-error: true

      - name: Upload Empirical Validation Results
        uses: actions/upload-artifact@v4
        with:
          name: empirical-validation-results
          path: simulation/output/real_world_results.json
        continue-on-error: true

  phase-transition:
    name: Phase Transition Experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scipy

      - name: Run Phase Transition Experiment
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          mkdir -p simulation/output/figures
          python scripts/run_phase_transition_exp.py --no-oracle --save-plot
        continue-on-error: true

      - name: Upload Phase Transition Figure
        uses: actions/upload-artifact@v4
        with:
          name: phase-transition-figure
          path: simulation/output/figures/phase_transition.png
          if-no-files-found: ignore
          retention-days: 30

  julia-simulate:
    name: Julia Simulation Smoke
    runs-on: ubuntu-latest
    # Julia dependency resolution/precompilation has previously hung for the
    # full 6h job limit and cancelled downstream gated workflows; bound it so a
    # hang degrades to a skipped smoke run instead.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        timeout-minutes: 90
        continue-on-error: true
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["SpecialFunctions", "Primes", "Distributions", "HypothesisTests",
                     "Agents", "Graphs", "DifferentialEquations", "OrdinaryDiffEq",
                     "CairoMakie", "DataFrames", "CSV", "JSON3", "HTTP",
                     "Yao", "YaoArrayRegister"])
          '

      - name: Run Julia simulation batch (smoke)
        run: julia --project=julia julia/scripts/run_simulation_batch.jl --smoke
        continue-on-error: true

      - name: Run Julia phase transition (smoke)
        run: julia --project=julia julia/scripts/run_phase_transition.jl --smoke
        continue-on-error: true

      - name: Upload Julia simulation results
        uses: actions/upload-artifact@v4
        with:
          name: julia-simulation-smoke
          path: results/julia/
          if-no-files-found: ignore
          retention-days: 5
        continue-on-error: true

  report:
    needs: [simulate, alpha-comparison, phase-transition, julia-simulate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-report-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py310-report-

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn tabulate numpy scipy

      - name: Download Phase Transition Figure
        uses: actions/download-artifact@v4
        with:
          name: phase-transition-figure
          path: simulation/output/figures
        continue-on-error: true

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_results

      - name: Download Real Data (incl. Empirical HuggingFace/AITA/GitHub PR)
        uses: actions/download-artifact@v4
        with:
          name: real-world-datasets
          path: data
        continue-on-error: true

      - name: Download Alpha Comparison Plot
        uses: actions/download-artifact@v4
        with:
          name: alpha-comparison-plot
          path: alpha_plot
        continue-on-error: true

      - name: Consolidate Results
        run: |
          mkdir -p combined_results final_report
          find all_results -name "*.json" -exec cp {} combined_results/ \; 2>/dev/null || true
          if [ -z "$(ls -A combined_results 2>/dev/null)" ]; then
            echo "[]" > combined_results/placeholder.json
          fi
          if [ -f alpha_plot/alpha_comparison_real_vs_simulated.png ]; then
            cp alpha_plot/alpha_comparison_real_vs_simulated.png final_report/
          fi
          ls -la combined_results/ final_report/ || true

      - name: Generate Report
        run: |
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/erh_core:$PYTHONPATH"
          python scripts/generate_comprehensive_report.py \
            --input-dir combined_results \
            --output-dir final_report \
            --empirical-dir data
        continue-on-error: true

      - name: Install R
        if: hashFiles('scripts/verify_analysis.R') != ''
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base

      - name: Install R packages
        if: hashFiles('scripts/verify_analysis.R') != ''
        continue-on-error: true
        run: |
          if command -v Rscript &> /dev/null; then
            mkdir -p ~/R/library
            Rscript -e ".libPaths(c('~/R/library', .libPaths())); install.packages('jsonlite', repos='https://cran.rstudio.com/', lib='~/R/library', quiet=TRUE)" || true
          fi

      - name: Verify with R (Optional)
        if: hashFiles('scripts/verify_analysis.R') != ''
        run: |
          if command -v Rscript &> /dev/null; then
            R_LIBS_USER=~/R/library Rscript scripts/verify_analysis.R combined_results final_report/r_verification || true
          fi

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-report
          path: final_report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Figures for Thesis
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulation-figures
          path: final_report/*.png
          retention-days: 30

      - name: Upload Simulation Figures
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quantum-figures
          path: simulation/output/figures/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Expand Plan Figures
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: expand-plan-figures
          path: |
            simulation/output/figures/paper_fig9_normalized_oscillation.pdf
            simulation/output/figures/paper_fig10_phase_transition_h.pdf
            simulation/output/figures/paper_fig11_prime_ladder.pdf
            simulation/output/figures/von_neumann_entropy_over_time.pdf
          if-no-files-found: ignore
          retention-days: 30

  collect-errors:
    name: Collect CI Errors
    runs-on: ubuntu-latest
    needs: [simulate, alpha-comparison, phase-transition, julia-simulate, report]
    if: always()
    steps:
      - name: Write error report
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          report = {
            "workflow": "simulation",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
            "known_errors": [
              {"job": "julia-simulate", "step": "Install Julia dependencies", "error": "Pkg.instantiate failed — wrong UUID for CSV and other packages"}
            ]
          }
          with open("ci-errors-simulation.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload error report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-errors-simulation
          path: ci-errors-simulation.json
          retention-days: 3
