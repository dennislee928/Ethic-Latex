name: Build Thesis (Gated)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  simulation:
    uses: ./.github/workflows/simulation.yml

  quantum:
    uses: ./.github/workflows/quantum_tests.yml
    secrets: inherit

  real-world-erh:
    name: Real-World ERH Implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run real-world ERH implementation
        uses: ./.github/actions/real-world-erh

  thesis:
    needs: [simulation, quantum, real-world-erh]
    uses: ./.github/workflows/build_thesis.yml
    secrets: inherit
