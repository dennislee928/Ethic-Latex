name: Build Thesis (Gated)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  simulation:
    uses: ./.github/workflows/simulation.yml

  quantum:
    uses: ./.github/workflows/quantum_tests.yml
    secrets: inherit

  thesis:
    needs: [simulation, quantum]
    uses: ./.github/workflows/build_thesis.yml
    secrets: inherit
