name: Build Thesis (Single Script)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          # Run unit tests for psychohistory modules
          pytest tests/test_temporal_erh.py tests/test_agent_framework.py tests/test_social_network.py \
                 tests/test_meta_monitor.py tests/test_hybrid_model.py tests/test_psychohistory_integration.py \
                 -v --tb=short || echo "⚠ Some unit tests failed, continuing..."

      - name: Run Psychohistory Simulation Tests (Quick)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          mkdir -p simulation/output/psychohistory_tests
          # Run quick tests in CI to save time
          python scripts/run_psychohistory_simulations.py --quick --output-dir simulation/output/psychohistory_tests || echo "⚠ Simulation tests failed, continuing..."

      - name: Run Complete Build Script
        run: |
          bash scripts/build_thesis.sh

      - name: Free disk space (GitHub Actions runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install TeX Live (minimal, not texlive-full)
        run: |
          # Use minimal TeX (~1GB) instead of texlive-full (~5–7GB) to avoid "No space left on device"
          # texlive-lang-chinese provides xeCJK.sty for Chinese LaTeX
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex \
            texlive-lang-chinese \
            latexmk

      - name: Compile English LaTeX Document
        run: |
          latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode ethical_riemann_hypothesis_en.tex

      - name: Compile Chinese LaTeX Document
        run: |
          latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode ethical_riemann_hypothesis_zh.tex

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ethical_riemann_hypothesis_pdfs
          path: |
            ethical_riemann_hypothesis_en.pdf
            ethical_riemann_hypothesis_zh.pdf
