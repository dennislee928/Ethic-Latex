name: Build Thesis (Single Script)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          # Run unit tests for psychohistory modules
          pytest tests/test_temporal_erh.py tests/test_agent_framework.py tests/test_social_network.py \
                 tests/test_meta_monitor.py tests/test_hybrid_model.py tests/test_psychohistory_integration.py \
                 -v --tb=short || echo "⚠ Some unit tests failed, continuing..."

      - name: Run Psychohistory Simulation Tests (Quick)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export PYTHONPATH=$PYTHONPATH:$(pwd)/simulation
          mkdir -p simulation/output/psychohistory_tests
          # Run quick tests in CI to save time
          python scripts/run_psychohistory_simulations.py --quick --output-dir simulation/output/psychohistory_tests || echo "⚠ Simulation tests failed, continuing..."

      - name: Run Complete Build Script
        run: |
          bash scripts/build_thesis.sh

      - name: Compile English LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ethical_riemann_hypothesis_en.tex
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          work_in_root_file_dir: false
          continue_on_error: false
          latexmk_shell_escape: false
          latexmk_use_lualatex: false
          pre_compile: |
            tlmgr update --self || true;
            tlmgr install algorithms subfigure || true

      - name: Compile Chinese LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ethical_riemann_hypothesis_zh.tex
          compiler: latexmk
          args: -file-line-error -halt-on-error -interaction=nonstopmode
          latexmk_use_xelatex: true
          work_in_root_file_dir: false
          continue_on_error: false
          latexmk_shell_escape: false
          latexmk_use_lualatex: false
          pre_compile: |
            tlmgr update --self || true
            tlmgr install fandol ctex xecjk fontspec xunicode || true

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ethical_riemann_hypothesis_pdfs
          path: |
            ethical_riemann_hypothesis_en.pdf
            ethical_riemann_hypothesis_zh.pdf
