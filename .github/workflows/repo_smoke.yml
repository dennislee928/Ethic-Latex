name: Repository Smoke

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  root-python:
    name: Root Python Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install root smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run root targeted tests
        run: |
          pytest tests/test_sdk.py tests/test_erh_phase1.py -q

      - name: Run root smoke import check
        run: |
          python - <<'PY'
          from numbers import Number
          from simulation.models import Action, Judgment
          from simulation.analysis.zeta_function import ethical_zeta_product

          action = Action(id=1, c=50, V=0.5, w=1.0)
          judgment = Judgment(action_id=1, J=0.4, V=0.5, delta=-0.1, mistake_flag=0)
          zeta_value = ethical_zeta_product(primes=[], s=1.0 + 0j, max_terms=10)

          assert action.c == 50 and action.V == 0.5
          assert judgment.J == 0.4
          assert isinstance(zeta_value, Number)
          print("root smoke OK")
          PY

  security-backend:
    name: Security Backend Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erh-security-app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend smoke tests
        run: |
          pytest tests -q

  security-frontend:
    name: Security Frontend Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erh-security-app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: erh-security-app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docs:
    name: Docs Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build docs
        run: |
          python -m sphinx -W -b html docs docs/_build/html
