name: Python SDK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[ml] pytest pylint flake8 networkx
    - name: Test
      run: |
        pytest tests/test_sdk.py
    - name: Lint with pylint
      run: |
        pylint --exit-zero erh/ || true
    - name: Lint with flake8
      run: |
        flake8 erh/ --max-line-length=120 --extend-ignore=E203,W503 || true
    - name: Security Check
      run: |
        pip install bandit
        # Run bandit but do not fail CI on findings; issues are reported in logs
        bandit -r erh/ || true

  publish:
    needs: test
    # Only publish on version tags (e.g., v1.0.0), not on PRs or regular pushes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install build tools
      run: |
        pip install build twine
    - name: Build
      run: |
        python -m build
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload dist/*
