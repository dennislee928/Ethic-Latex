name: Real-World ERH Implementation
description: Run the real-world ERH case studies, regression tests, and cross-case comparison.

runs:
  using: composite
  steps:
    - name: Install real-world ERH dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest matplotlib pandas numpy scipy scikit-learn

    - name: Run real-world ERH regression tests
      shell: bash
      env:
        ERH_REAL_WORLD_OFFLINE: "1"
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE:-$(pwd)}:${GITHUB_WORKSPACE:-$(pwd)}/erh_core:${PYTHONPATH}"
        pytest \
          tests/test_content_moderation_case_study.py \
          tests/test_compas_real_world_extensions.py \
          tests/test_medical_triage_case_study.py \
          tests/test_truthfulqa_case_study.py \
          tests/test_llm_bias_case_study.py \
          tests/test_erh_case_comparison.py \
          -v --tb=short

    - name: Run real-world ERH case scripts
      shell: bash
      env:
        ERH_REAL_WORLD_OFFLINE: "1"
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE:-$(pwd)}:${GITHUB_WORKSPACE:-$(pwd)}/erh_core:${PYTHONPATH}"
        mkdir -p simulation/output simulation/output/figures figures
        python simulation/real_data/content_moderation_case_study.py
        python simulation/real_data/medical_triage_case_study.py
        python simulation/real_data/truthfulqa_case_study.py
        python simulation/real_data/llm_bias_case_study.py
        python simulation/real_data/erh_case_comparison.py
        cp simulation/output/erh_case_alpha_comparison.png figures/ 2>/dev/null || true
