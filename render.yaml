# Ethical Riemann Hypothesis — Streamlit simulation app
# See README.md and docs/CLOUD_DEPLOYMENT.md for alternatives (Binder, Docker).
services:
  - type: web
    name: ethical-riemann-hypothesis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run simulation/app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      # Optional: for quantum cloud backend (IBM Quantum Runtime)
      # - key: IBM_QUANTUM_TOKEN
      #   sync: false

